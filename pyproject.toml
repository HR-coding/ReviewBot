[project]
name = "github-pr-reviewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HR-coding", email = "harish.rajagopalan01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[tool.uv.build-backend]
module-name = "reviewer"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
